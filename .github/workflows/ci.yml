name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:                          # ← 移到顶层
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (g++-13)
    runs-on: ubuntu-24.04             # ← 自带 gcc-13，省 PPA

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-13 cmake ragel pkg-config \
            libboost-all-dev libssl-dev libyaml-cpp-dev \
            libhiredis-dev libgtest-dev libgmock-dev \
            libabsl-dev nlohmann-json3-dev libidn2-dev \
            libgumbo-dev default-libmysqlclient-dev zlib1g-dev

      - name: Verify toolchain
        run: |
          g++-13 --version
          cmake --version
          ragel --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_C_COMPILER=gcc-13

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --timeout 120 --parallel $(nproc)

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/Testing/Temporary/